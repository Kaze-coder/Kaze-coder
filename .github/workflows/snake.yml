name: Update Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Kaze-coder
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#eea84b
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#d8f06a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
